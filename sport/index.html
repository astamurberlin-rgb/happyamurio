<script>
/* Presentation and form interaction only. Auth and diary storage stay in each app. */
(function(root){
  'use strict';
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function draft(box){
    var email=box&&box.querySelector('[name="email"]'),password=box&&box.querySelector('[name="password"]');
    return {email:email?email.value:'',password:password?password.value:'',visible:!!(password&&password.type==='text')};
  }
  function button(attr,action,text,primary,disabled,submit){return '<button class="happy-button'+(primary?' primary':'')+'" type="button" '+attr+'="'+action+'"'+(disabled?' disabled':'')+(submit?' data-happy-ui-submit':'')+'>'+esc(text)+'</button>'}
  function account(options){
    var o=options||{},d=o.draft||{},attr=o.sport?'data-happy':'data-cl',html='';
    if(o.connected){
      html='<b class="happy-account-name">'+esc(o.email||'Аккаунт Happy')+'</b><span class="happy-account-status">'+esc(o.secondary||'Вход выполнен')+'</span><div class="happy-actions">'+button(attr,'sync','Обновить связь',true,o.busy)+button(attr,'out','Выйти',false,o.busy)+'</div>';
    }else{
      html='<input class="happy-input" type="email" id="clEmail" name="email" aria-label="Почта" placeholder="Почта" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(d.email)+'">'+
        '<div class="happy-password"><input class="happy-input" type="'+(d.visible?'text':'password')+'" id="clPw" name="password" aria-label="Пароль" placeholder="Пароль, от 8 знаков" autocomplete="current-password" value="'+esc(d.password)+'"><button class="happy-password-toggle" type="button" data-happy-ui="password" aria-label="'+(d.visible?'Скрыть пароль':'Показать пароль')+'" aria-pressed="'+!!d.visible+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>'+
        '<div class="happy-actions">'+button(attr,'in','Войти',true,o.busy,true)+button(attr,'up','Создать аккаунт',false,o.busy)+'</div>';
    }
    var message=o.busy?'Подключаем аккаунт…':o.error||o.message||'';
    if(message)html+='<p class="happy-note'+(o.error&&!o.busy?' happy-error':'')+'" role="status">'+esc(message)+'</p>';
    return '<div class="happy-account" data-happy-account>'+html+'</div>';
  }
  async function act(action,adapter){
    var a=adapter,state=a.state;
    if(state.busy)return;
    if(action==='out'){a.signOut();state.msg='Выход выполнен. Записи на устройстве сохранены.';a.paint();return}
    if(action==='sync'){
      state.busy=true;state.err='';a.paint();
      try{await a.refresh()}catch(e){state.err=e.message||String(e)}finally{state.busy=false;a.paint()}
      return;
    }
    if(action!=='in'&&action!=='up')return;
    var d=draft(a.box()),email=d.email.trim().toLowerCase(),pw=d.password;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){state.err='Почта записана с ошибкой';a.paint();return}
    if(!pw||(action==='up'&&pw.length<8)){state.err=action==='up'?'Для нового аккаунта нужен пароль от 8 знаков':'Введи пароль';a.paint();return}
    state.busy=true;state.err='';state.msg='';a.paint();
    try{
      var result=await a.signIn(email,pw,action);
      if(result==='confirm'){state.msg='Аккаунт создан. Подтверди почту по ссылке из письма, затем нажми «Войти».';return}
      await a.afterSignIn();
    }catch(e){state.err=e.message||String(e)}finally{state.busy=false;a.paint()}
  }
  function note(){return '<p class="happy-note">Один аккаунт для Happy Day, Happy Meal и Happy Sport. Сохрани пароль: он нужен для чтения облачных копий. Полная синхронизация дневников пока в разработке.</p>'}
  function lastText(value){return value?'Связь обновлена в '+new Date(value).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'Вход выполнен'}
  root.HappyUI={escape:esc,draft:draft,account:account,act:act,accountNote:note,lastText:lastText};
  if(typeof document!=='undefined'){
    document.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('[data-happy-ui="password"]');if(!b)return;
      var input=b.closest('[data-happy-account]').querySelector('[name="password"]');
      input.type=input.type==='password'?'text':'password';b.setAttribute('aria-label',input.type==='password'?'Показать пароль':'Скрыть пароль');b.setAttribute('aria-pressed',String(input.type==='text'));
    });
    document.addEventListener('keydown',function(e){
      var label=e.target.closest&&e.target.closest('label.happy-button[role="button"]');
      if(label&&e.target===label&&(e.key==='Enter'||e.key===' ')){e.preventDefault();var file=label.querySelector('input[type="file"]');if(file)file.click();return}
      if(e.key!=='Enter'||e.isComposing||!e.target.matches('input[name="email"],input[name="password"]'))return;
      var box=e.target.closest('[data-happy-account]'),submit=box&&box.querySelector('[data-happy-ui-submit]');
      if(submit&&!submit.disabled){e.preventDefault();submit.click()}
    });
  }
})(globalThis);

function pulseCard(){return `<section class="card pulse-card"><div class="pulse-top"><div><div class="pulse-label">${icon('heartbeat')} Пульс</div><strong class="pulse-value" id="pulse-value">${state.demoPulse?'124':'—'} <small>уд/мин</small></strong></div><button class="badge" data-action="pulse-toggle">${state.demoPulse?'Демо · выключить':'Включить демо'}</button></div><div class="pulse-scale">${['#b1d7ec','#80ded7','#e1e69c','#fac58e','#efa5cc'].map(c=>`<span style="background:${c}"></span>`).join('')}${state.demoPulse?'<i id="pulse-marker" style="left:46%"></i>':''}</div><div class="scale-labels"><span>50</span><span>80</span><span>110</span><span>140</span><span>170</span><span>200</span></div><div class="sub" style="font-size:10px;margin-top:9px">${state.demoPulse?'Симуляция показаний · шкала уд/мин, не персональные зоны':'Датчик не подключён · показаний пока нет'}</div></section>`}
function renderActive(){const w=state.active;if(!w){view='diary';return renderDiary()}return `<div class="active-workout"><div class="current-bar row between"><div><div class="active-timer">${workoutPauseButton(w)}<div class="clock" id="active-clock" role="timer">00:00</div></div></div><button class="button primary" style="width:auto;min-height:41px;padding:10px 14px" data-action="finish">${icon('check')} Завершить</button></div>${pulseCard()}${w.exercises.map((e,ei)=>activeExercise(e,ei)).join('')}<button class="button dashed" data-action="add-exercise" data-phase="main">${icon('plus')} Добавить упражнение</button><label class="field">Заметка о тренировке<textarea id="active-note" placeholder="Как прошла тренировка, самочувствие…">${esc(w.notes||'')}</textarea></label><button class="button" data-action="save-template">${icon('copy')} Сохранить как шаблон</button><button data-action="discard-active" class="text-btn discard-active">Удалить черновик тренировки</button></div>`}
function setMetricInput(e,ei,si,key,value,unit,max,step,label){return `<label class="set-metric"><input type="number" min="0" max="${max}" step="${step}" inputmode="${step==='1'?'numeric':'decimal'}" data-set="${ei},${si},${key}" value="${value??''}" aria-label="${label} ${si+1} ${esc(e.name)}"><span class="set-unit" aria-hidden="true">${unit}</span></label>`}
function activeExercise(e,ei){const timed=isTimed(e),loaded=isLoaded(e),distance=hasDistance(exercise(e.id)),fields=timed?(distance?2:1):3;return `<article class="card set-card"><div class="row between"><h3>${esc(e.name)}</h3><button class="exercise-technique" data-action="exercise-detail" data-id="${esc(e.id)}" aria-label="Информация об упражнении: ${esc(e.name)}">${icon('info')}</button></div><div class="set-rows">${e.sets.map((s,si)=>swipeSetRow('set',ei,si,`<div class="set-row ${timed?'':'strength-set'} ${s.done?'complete':''}" style="--set-fields:${fields};--set-controls:2"><span class="set-number">${si+1} подход</span>${timed?setTimeInput(e,ei,si,s):setMetricInput(e,ei,si,'weight',s.weight,'кг',2000,'.5',loaded?'Вес':'Дополнительный вес')}${timed?(distance?setMetricInput(e,ei,si,'distance',s.distance||'','м',100000,'1','Метры'):''):setMetricInput(e,ei,si,'reps',s.reps,'повт.',10000,'1','Повторы')}${timed?'':setTimeInput(e,ei,si,s)}${renderSetTimer(s,ei,si,e.name)}<button class="done ${s.done?'selected':''}" data-action="set-done" data-ei="${ei}" data-si="${si}" aria-label="${s.done?'Снять отметку':'Выполнить'} подход ${si+1} ${esc(e.name)}" aria-pressed="${s.done}">${icon('check')}</button></div>`)+renderSetRest(s,ei,si,e.name)).join('')}</div><div class="set-actions"><button class="set-add" data-action="add-set" data-ei="${ei}">${icon('plus')} Подход</button><button class="set-add" data-action="add-rest" data-ei="${ei}" ${e.sets.length?'':'disabled'}>${icon('plus')} Перерыв</button></div><input class="set-note" data-ex-note="${ei}" value="${esc(e.notes||'')}" placeholder="Добавить заметку…" aria-label="Заметка: ${esc(e.name)}"></article>`}

function renderDetail(){const w=state.workouts.find(w=>w.id===detailId);if(!w)return renderTop('Запись не найдена',false);return `<div class="workout-detail"><div class="training-heading"><h1 class="view-title">${esc(w.title)}</h1><button class="text-btn workout-share" data-action="share-workout" data-id="${esc(w.id)}" aria-label="Поделиться тренировкой"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m-4 4 4-4 4 4M7 10H5v11h14V10h-2"/></svg></button></div><div class="card workout-summary"><div class="row between workout-summary-header"><span class="sub">${dateLabel(w.start.slice(0,10))}<small class="workout-time-range">${w.start.slice(11,16)} — ${w.end.slice(11,16)}</small></span><button class="text-btn" data-action="edit-workout" data-id="${esc(w.id)}">${icon('pencil-simple')} Редактировать</button></div>${workoutSummaryMetrics(w)}</div>${w.warnings?.length?`<div class="source-note warn">${w.warnings.map(esc).join('<br>')}</div>`:''}${w.exercises.map(e=>`<article class="card set-card"><div class="row between"><h3 class="exercise-history-heading"><button class="exercise-history-name" data-action="exercise-history" data-id="${esc(e.id)}" aria-label="История упражнения: ${esc(e.name)}">${esc(e.name)}</button></h3><button class="exercise-technique" data-action="exercise-detail" data-id="${esc(e.id)}" aria-label="Информация об упражнении: ${esc(e.name)}">${icon('info')}</button></div>${e.sets.map((s,i)=>`<div class="read-set"><span class="type">${i+1}</span><strong>${isTimed(e)?durationText(s.seconds):s.weight?fmt(s.weight)+' кг':'Свой вес'}</strong><span>${isTimed(e)?s.distance?fmt(s.distance)+' м':'':s.reps+' повт.'+(s.seconds>0?'<small class="read-set-time">'+durationText(s.seconds)+'</small>':'')}</span></div>${renderReadRest(s)}`).join('')}${e.notes?`<p class="fineprint">${esc(e.notes)}</p>`:''}</article>`).join('')}${w.notes?`<div class="card"><h3>Заметки</h3><p class="sub" style="white-space:pre-wrap;margin-top:9px">${esc(w.notes)}</p></div>`:''}<p class="fineprint">Источник: ${esc(w.source)}.${volume(w)?'<br>* Объём по записанному внешнему весу. Вес тела не добавляется.':''}</p><button class="button" data-action="repeat-workout" data-id="${esc(w.id)}"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.3 5.7"/></svg> Повторить тренировку</button><button data-action="delete-workout" data-id="${esc(w.id)}" class="text-btn delete-workout">Удалить запись</button></div>`}
function renderProfile(){return renderTop('Профиль',false)+`<div class="card"><div class="row">${icon('user-circle')}<div><h2>Happy Sport</h2><p class="sub" style="margin-top:4px">Тренировки и замеры</p></div></div></div><div class="section-title"><h2>Подключения</h2><span class="badge demo">Прототип</span></div><div class="card"><div class="setting-row"><div class="row">${icon('heartbeat')}<div><b>Apple Здоровье</b><small>Нужна нативная интеграция</small></div></div><span class="badge">Не подключено</span></div><div class="setting-row"><div class="row">${icon('headphones')}<div><b>Датчик пульса</b><small>Часы или совместимые наушники</small></div></div><button class="text-btn" data-action="connections">${icon('info')}</button></div><div class="setting-row"><div><b>Happy Meal</b><small>Потреблённая энергия · демо</small></div><button class="text-btn" data-action="energy">${icon('sliders-horizontal')}</button></div></div><div class="section-title"><h2>Мои данные</h2></div><div class="card"><div class="setting-row"><div><b>Тренировки</b><small>Записи этого браузера</small></div><strong>${state.workouts.length}</strong></div><div class="setting-row"><div><b>Замеры</b><small>Личные записи этого браузера</small></div><strong>${state.measurements.length}</strong></div><div class="setting-row"><div><b>Демонстрация пульса</b><small>Симулирует шкалу во время тренировки</small></div><input class="toggle" id="demo-pulse" type="checkbox" aria-label="Демонстрация пульса" ${state.demoPulse?'checked':''}></div></div><button class="button" data-action="export" style="margin-top:14px">${icon('download-simple')} Выгрузить все записи</button><button class="button" data-action="about" style="margin-top:10px">${icon('info')} О первом прототипе</button><p class="fineprint">Записи сохраняются в этом браузере. Для переноса или резервной копии выгрузи данные. Никакие записи не отправляются в HealthKit из этого прототипа.</p>`}
function updateClock(){if(!state.active)return;updateSetCountdown();const node=$('#active-clock');if(node){const diff=workoutActiveSeconds(state.active),h=Math.floor(diff/3600),m=Math.floor(diff/60)%60,s=diff%60;node.textContent=(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}if(state.demoPulse&&$('#pulse-value')){const n=124+Math.round(5*Math.sin(Date.now()/18000));$('#pulse-value').innerHTML=`${n} <small>уд/мин</small>`;$('#pulse-marker').style.left=(n-50)/150*100+'%'}}
setInterval(updateClock,1000);
function openSheet(title,html,kind=''){priorFocus=document.activeElement;sheetKind=kind;$('#modal-root').innerHTML=`<div class="overlay" id="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="handle"></div><div class="sheet-top"><h2 id="sheet-title">${esc(title)}</h2><button class="icon-btn" data-action="close" aria-label="Закрыть">${icon('x')}</button></div>${html}</section></div>`;document.body.style.overflow='hidden';$('.sheet [data-action="close"]').focus()}
function closeSheet(){if(!$('#modal-root'))return;$('#modal-root').innerHTML='';document.body.style.overflow='';sheetKind='';if(priorFocus?.isConnected)priorFocus.focus()}
function showStart(){if(state.active){goto('active');return}openSheet('Начать тренировку',`<div class="stack">${templates().map(t=>`<button class="card workout-row" data-action="start" data-id="${esc(t.id)}"><span class="symbol">${icon(kindIcon(t.kind))}</span><span class="grow"><h3>${esc(t.title)}</h3><small class="muted">${t.items.length} упражнений · можно изменить</small></span>${icon('play')}</button>`).join('')}</div><button class="button dashed" style="margin-top:13px" data-action="start-empty">${icon('plus')} Пустая тренировка</button>`)}
function previewTemplate(id){const t=templates().find(t=>t.id===id);openSheet(t.title,`<div class="large-icon">${icon(kindIcon(t.kind))}</div><p class="sheet-info">${esc(t.description||'Твой шаблон тренировки')}. Все значения можно изменить.</p>${Object.entries(phaseNames).map(([p,n])=>`<div class="phase-heading"><strong>${n}</strong></div>${t.items.filter(x=>x[1]===p).map(([eid,_,sets])=>`<div class="row between" style="padding:9px 0;font-size:13px"><span>${esc(exercise(eid)?.name||eid)}</span><small>${sets} подх.</small></div>`).join('')||'<div class="sub">Не задана</div>'}`).join('')}<div class="sheet-actions"><button class="button primary" data-action="start" data-id="${esc(t.id)}">${icon('play')} Начать</button><button class="button" data-action="edit-template" data-id="${esc(t.id)}">${icon('pencil-simple')} Изменить шаблон</button></div>`)}
function blankSet(e,phase='main'){return {type:phase,weight:0,reps:/reps|load/.test(e.profile)?10:0,seconds:/duration|hold|distance_time/.test(e.profile)?(phase==='main'?600:120):0,distance:0,done:false}}
function startWorkout(id,title){if(state.active){goto('active');toast('Продолжена текущая тренировка');return}const t=templates().find(x=>x.id===id)||{title:title||'Свободная тренировка',kind:'gym',items:[]};state.active={id:'local-'+Date.now(),title:t.title,kind:t.kind,icon:t.icon||null,start:localNow(),end:'',notes:'',source:'Моя запись',demo:false,exercises:t.items.map(([eid,phase,count])=>({id:eid,name:exercise(eid).name,phase,notes:'',sets:Array.from({length:count},()=>blankSet(exercise(eid),phase))}))};persist();goto('active')}
function showPicker(phase){openSheet('Добавить упражнение',`<input id="picker-phase" type="hidden" value="${phase}"><label class="search">${icon('magnifying-glass')}<input id="picker-search" placeholder="Название упражнения…" aria-label="Найти упражнение"></label><div id="picker-results" class="exercise-list">${allExercises().slice(0,18).map(e=>exerciseCard(e,'pick-exercise')).join('')}</div><button class="button dashed" style="margin-top:12px" data-action="custom-exercise">${icon('plus')} Создать своё</button>`,'picker')}
function pickExercise(id){const e=exercise(id),phase=$('#picker-phase')?.value||'main';if(!state.active){startWorkout(null);showPicker(phase);return}state.active.exercises.push({id:e.id,name:e.name,phase,notes:'',sets:[blankSet(e,phase)]});persist();closeSheet();render();toast('Упражнение добавлено')}
function showWorkoutForm(mode,id){const active=mode==='finish'||mode==='active',w=active?state.active:state.workouts.find(x=>x.id===id),start=w?.start||selectedDate+'T18:00',end=mode==='finish'?localNow():w?.end||selectedDate+'T19:00';openSheet(mode==='finish'?'Завершить тренировку':mode==='active'?'Время начала':w?'Редактировать запись':'Добавить тренировку',`<form id="workout-form" data-mode="${mode}" data-id="${esc(id||'')}"><label class="field">Название<input name="title" value="${esc(w?.title||'Тренажёрный зал')}" required maxlength="100"></label>${!w?`<label class="field">Вид<select name="kind"><option value="gym">Тренажёрный зал</option><option value="sea">Плавание в море</option><option value="bars">Турники</option><option value="cardio">Кардио</option></select></label>`:''}<label class="field">Начало<input name="start" type="datetime-local" step="1" required value="${start}"></label>${mode!=='active'?`<label class="field">Окончание<input name="end" type="datetime-local" step="1" required value="${end}"></label><label class="field">Заметка<textarea name="notes" placeholder="Упражнения, самочувствие, детали…">${esc(w?.notes||'')}</textarea></label>`:''}${mode==='finish'?`<p class="sheet-info">В журнал попадут отмеченные подходы: ${w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)}. Можно сохранить только время тренировки.</p>`:''}<div id="form-error" class="form-error" role="alert"></div><button class="button primary" type="submit">${icon('check')} ${mode==='finish'?'Завершить и сохранить':'Сохранить'}</button></form>`)}
function showExercise(id){const e=exercise(id);if(!e)return;const records=state.workouts.flatMap(w=>w.exercises.filter(x=>x.id===id).map(x=>{const max=Math.max(...x.sets.filter(s=>s.done).map(s=>isTimed(x)?s.seconds:isLoaded(x)?s.weight:s.reps),0);return{date:w.start.slice(0,10),max}})).sort((a,b)=>a.date.localeCompare(b.date));let chart='';if(records.length>1){const vals=records.map(r=>r.max),min=Math.min(...vals)*.85,max=Math.max(...vals)*1.1||1,pts=vals.map((v,i)=>`${15+i*310/(vals.length-1)},${105-(v-min)/(max-min||1)*90}`).join(' ');chart=`<div class="card chart-card"><div class="row between"><h3>Динамика</h3><small>${isTimed(e)?'сек':isLoaded(e)?'кг':'повторения'}</small></div><svg viewBox="0 0 340 120" role="img" aria-label="Лучший показатель по тренировкам"><path d="M15 105H325" stroke="#ffffff33" fill="none"/><polyline points="${pts}" stroke="#b6fff0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>${vals.map((v,i)=>`<circle cx="${15+i*310/(vals.length-1)}" cy="${105-(v-min)/(max-min||1)*90}" r="4" fill="#efffff"/>`).join('')}</svg><div class="chart-caption"><span>${shortDate(records[0].date)}</span><span>${shortDate(records.at(-1).date)}</span></div><p class="fineprint">Максимум за тренировку. ${isLoaded(e)?'Сравнивается записанный вес; количество повторов может отличаться.':'Вес тела здесь не учитывается.'}</p></div>`}openSheet(e.name,`<div class="row" style="margin-bottom:18px"><span class="placeholder" style="width:65px;height:65px">${icon('image')}</span><span><b style="font-size:13px">${esc(e.category)}</b><div class="sub">${esc(e.en||'Моё упражнение')}</div></span></div>${chart||'<p class="sheet-info">Динамика появится после нескольких записей этого упражнения.</p>'}${records.length?`<table class="data-table"><thead><tr><th>Тренировка</th><th>Лучшее значение</th></tr></thead><tbody>${records.slice(-5).reverse().map(r=>`<tr><td>${dateLabel(r.date)}</td><td>${fmt(r.max)} ${isTimed(e)?'сек':isLoaded(e)?'кг':'повт.'}</td></tr>`).join('')}</tbody></table>`:''}<div class="sheet-actions"><button class="button primary" data-action="use-exercise" data-id="${esc(id)}">${icon('plus')} Добавить в тренировку</button>${e.scope==='user'?`<button class="button" data-action="custom-exercise" data-id="${esc(id)}">${icon('pencil-simple')} Изменить упражнение</button>`:''}</div>`)}
function customExercise(id){const e=exercise(id);openSheet(e?'Моё упражнение':'Создать упражнение',`<form id="exercise-form" data-id="${esc(e?.id||'')}"><label class="field">Название<input name="name" required maxlength="120" value="${esc(e?.name||'')}" placeholder="Например, тяга моего тренажёра"></label><label class="field">Как ещё называешь<input name="aliases" value="${esc(e?.aliases?.join(', ')||'')}" placeholder="Короткие названия через запятую"></label><label class="field">Оборудование<input name="equipment" value="${esc(e?.equipment?.join(', ')||'')}" placeholder="Без оборудования, резинка, тренажёр…"></label><label class="field">Что записываем<select name="profile">${[['load_reps','Вес и повторения'],['reps','Повторения'],['duration','Время'],['distance_time','Время и расстояние'],['hold','Удержание по времени']].map(([v,t])=>`<option value="${v}" ${e?.profile===v?'selected':''}>${t}</option>`).join('')}</select></label><button class="button primary" type="submit">${icon('check')} Сохранить в мою библиотеку</button></form>`)}
function templateItemRow(item=['','main',3]){return `<div class="card template-item" style="padding:11px;margin-bottom:10px"><select name="exerciseId" aria-label="Упражнение шаблона" required style="width:100%;font-size:12px"><option value="">Выбрать упражнение…</option>${allExercises().map(e=>`<option value="${esc(e.id)}" ${e.id===item[0]?'selected':''}>${esc(e.name)}</option>`).join('')}</select><div class="row" style="margin-top:8px"><input type="hidden" name="phase" value="${esc(item[1]||'main')}"><span class="grow sub">Подходы</span><input type="number" name="count" aria-label="Число подходов" min="1" max="50" value="${item[2]}" style="width:57px;padding:10px 5px;text-align:center"><button class="icon-btn" type="button" data-action="remove-template-item" aria-label="Убрать упражнение из шаблона">${icon('x')}</button></div></div>`}
function editTemplate(id,fromActive=false){const t=templates().find(t=>t.id===id),w=fromActive?state.active:null;openSheet(t?'Изменить тренировку':'Новая тренировка',`<form id="template-form" data-id="${esc(id||'')}"><label class="field">Название<input name="title" required maxlength="100" value="${esc(t?.title||w?.title||'')}" placeholder="Моя тренировка"></label><label class="field">Вид<select name="kind">${[['gym','Зал'],['sea','Море'],['bars','Турники'],['cardio','Кардио']].map(([v,n])=>`<option value="${v}" ${(t?.kind||w?.kind)===v?'selected':''}>${n}</option>`).join('')}</select></label><div id="template-items">${(t?.items||w?.exercises.map(e=>[e.id,e.phase,e.sets.length])||[['','main',3]]).map(templateItemRow).join('')}</div><button class="button dashed" type="button" data-action="add-template-item">${icon('plus')} Упражнение</button><button class="button primary" type="submit" style="margin-top:14px">${icon('check')} Сохранить тренировку</button></form>`)}

function workoutSummaryMetrics(w){

function shapeDock(){

  if(!W) return;

  let cy=rFab*(1-2*peek); const floor=H-(cy+rn); if(floor<11) cy-=(11-floor);

  const k=rn/(rn+rf), tx=cx-dx*k, rx=cx+dx*k,ty=cy+(rf-cy)*k;
  const d=`M${R} 0 L${(cx-dx).toFixed(2)} 0 A${rf} ${rf} 0 0 1 ${tx.toFixed(2)} ${ty.toFixed(2)} A${rn} ${rn} 0 0 0 ${rx.toFixed(2)} ${ty.toFixed(2)} A${rf} ${rf} 0 0 1 ${(cx+dx).toFixed(2)} 0 L${W-R} 0 A${R} ${R} 0 0 1 ${W} ${R} L${W} ${H-R} A${R} ${R} 0 0 1 ${W-R} ${H} L${R} ${H} A${R} ${R} 0 0 1 0 ${H-R} L0 ${R} A${R} ${R} 0 0 1 ${R} 0Z`;
  const bg=document.getElementById('dockBg');
  bg.style.clipPath=`path('${d}')`; bg.style.webkitClipPath=`path('${d}')`;
  const svg=document.getElementById('dockEdge');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.querySelector('path').setAttribute('d',d);
  const fab=document.getElementById('sport-fab');fab.style.left='50%';fab.style.top=cy+'px';fab.style.width=(rFab*2)+'px';fab.style.height=(rFab*2)+'px';

}

function clB64(u8){ var s=''; for(var i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s) }
function clUnb64(t){ var s=atob(t), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u }
function clUtf(t){ return new TextEncoder().encode(t) }
function clOn(){ return !!(CL.s&&CL.ck) }
async function clLoad(){
  try{
    var raw=await rawGet(CL_KEY); if(!raw) return;
    var o=JSON.parse(raw); CL.s=o.s||null; CL.last=o.last||0; CL.kraw=o.k||null;
    if(CL.kraw) CL.ck=await crypto.subtle.importKey('raw',clUnb64(CL.kraw),{name:'AES-GCM'},false,['encrypt','decrypt']);
  }catch(e){ CL.s=null; CL.ck=null; CL.kraw=null }
  finally{ CL.ready=true }
}
function clStore(){ try{localStorage.setItem(CL_KEY,JSON.stringify({s:CL.s,k:CL.kraw,last:CL.last||0}))}catch{CL.err='Браузер не сохраняет вход. Разреши хранение данных сайта.'} }
/* понятные слова вместо ответов сервера */
function clErrText(j,st){
  var m=String((j&&(j.msg||j.error_description||j.message||j.error))||'');
  if(/invalid login|invalid_credentials|invalid grant/i.test(m)) return 'Неверная почта или пароль';
  if(/already (been )?registered|user_already_exists|already exists/i.test(m)) return 'Такой аккаунт уже есть — нажми «Войти»';
  if(/not confirmed|email_not_confirmed/i.test(m)) return 'Почта не подтверждена — открой письмо от Supabase';
  if(/refresh token/i.test(m)) return 'Вход устарел — войди заново';
  if(/signups? (are )?(not allowed|disabled)/i.test(m)) return 'Новые аккаунты сейчас закрыты';
  if(/address .*invalid|invalid email|email_address_invalid/i.test(m)) return 'Почта записана с ошибкой';
  if(/password/i.test(m)) return 'Пароль не подходит: нужно хотя бы 8 знаков';
  if(st===429) return 'Слишком много попыток — подожди минуту';
  if(!st) return 'Нет связи с сервером — попробую позже';
  return m||('Сервер ответил ошибкой '+st);
}
async function clAuth(path,body){
  var r;
  try{ r=await fetch(CLOUD.url+'/auth/v1/'+path,{signal:AbortSignal.timeout(20000),method:'POST',headers:{'apikey':CLOUD.key,'Content-Type':'application/json'},body:JSON.stringify(body)}) }
  catch(e){ throw new Error(clErrText(null,0)) }
  var j=null; try{ j=await r.json() }catch(e){}
  if(!r.ok) throw new Error(clErrText(j,r.status));
  return j;
}
function clSes(j,old){
  return {at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,
          uid:(j.user&&j.user.id)||(old&&old.uid),email:(j.user&&j.user.email)||(old&&old.email)};
}
async function clDerive(pw,uid){
  var base=await crypto.subtle.importKey('raw',clUtf(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:clUtf('happyday-sync-v1:'+uid),iterations:CL_ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
  CL.kraw=clB64(new Uint8Array(await crypto.subtle.exportKey('raw',k)));
  CL.ck=await crypto.subtle.importKey('raw',clUnb64(CL.kraw),{name:'AES-GCM'},false,['encrypt','decrypt']);
}
/* mode: 'in' — войти, 'up' — создать аккаунт; ответ: 'ok' | 'confirm' (надо подтвердить почту) */
async function clSignIn(email,pw,mode){
  email=email.trim().toLowerCase();
  var j=mode==='up'?await clAuth('signup',{email:email,password:pw})
                   :await clAuth('token?grant_type=password',{email:email,password:pw});
  if(!j||!j.access_token) return 'confirm';
  CL.s=clSes(j); await clDerive(pw,CL.s.uid);
  CL.err=''; clStore(); return 'ok';
}
function clSignOut(){
  var t=CL.s&&CL.s.at;
  CL.s=null; CL.ck=null; CL.kraw=null; CL.err=''; CL.last=0; clStore();
  if(t) fetch(CLOUD.url+'/auth/v1/logout?scope=local',{method:'POST',headers:{'apikey':CLOUD.key,'Authorization':'Bearer '+t}}).catch(function(){});
}
async function clToken(force){
  if(!CL.s) throw new Error('Нет входа');
  if(!force&&Date.now()<CL.s.exp-60000) return CL.s.at;
  try{ var j=await clAuth('token?grant_type=refresh_token',{refresh_token:CL.s.rt}) }
  catch(e){ if(/устарел|Неверная/.test(e.message)){ CL.s=null; CL.ck=null; CL.kraw=null; clStore() } throw e }
  CL.s=clSes(j,CL.s); clStore(); return CL.s.at;
}
async function clRest(method,query,body,prefer,again){
  var t=await clToken(), r;
  var h={'apikey':CLOUD.key,'Authorization':'Bearer '+t,'Content-Type':'application/json'};
  if(prefer) h['Prefer']=prefer;
  try{ r=await fetch(CLOUD.url+'/rest/v1/app_sync'+query,{method:method,headers:h,body:body?JSON.stringify(body):undefined}) }
  catch(e){ throw new Error(clErrText(null,0)) }
  if(r.status===401&&!again){ await clToken(true); return clRest(method,query,body,prefer,true) }
  if(!r.ok){ var j=null; try{ j=await r.json() }catch(e){} throw new Error(clErrText(j,r.status)) }
  if(r.status===204) return null;
  var txt=await r.text(); return txt?JSON.parse(txt):null;
}
function clAad(app,kind){ return clUtf(CL.s.uid+'|'+app+'|'+kind) }
/* положить свою сводку: зашифровать на телефоне и заменить прошлую */
async function clPut(app,kind,obj,at){
  if(!clOn()) return false;
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv,additionalData:clAad(app,kind)},CL.ck,clUtf(JSON.stringify(obj))));
  await clRest('POST','?on_conflict=user_id,app,kind',
    {user_id:CL.s.uid,app:app,kind:kind,v:1,iv:clB64(iv),data:clB64(ct),at:at||Date.now()},
    'resolution=merge-duplicates,return=minimal');
  CL.last=Date.now(); CL.err=''; clStore(); return true;
}
/* время чужой сводки на сервере — без скачивания самой сводки */
async function clAt(app,kind){
  if(!clOn()) return null;
  var a=await clRest('GET','?select=at&app=eq.'+app+'&kind=eq.'+kind);
  return a&&a[0]?a[0].at:null;
}
/* взять чужую сводку и расшифровать; не тот ключ (меняли пароль) — понятная ошибка */
async function clGet(app,kind){
  if(!clOn()) return null;
  var a=await clRest('GET','?select=v,iv,data,at&app=eq.'+app+'&kind=eq.'+kind);
  if(!a||!a[0]) return null;
  var pt;
  try{ pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:clUnb64(a[0].iv),additionalData:clAad(app,kind)},CL.ck,clUnb64(a[0].data)) }
  catch(e){ throw new Error('Сводку на сервере не расшифровать — её записали с другим паролем. Обновится, когда соседнее приложение запишет новую') }
  CL.last=Date.now(); CL.err=''; clStore();
  return JSON.parse(new TextDecoder().decode(pt));
}

/* Shared summary, independent of rendering. Stable IDs make edits replace entries. */
const SPORT_LINK_KEY='hd_link_sport_v1';
function sportFacts(w){return {id:w.id,title:w.title,kind:w.kind,start:w.start,end:w.end,duration:Math.max(0,+w.duration||0),energyKcal:!w.demo&&Number.isFinite(w.energyKcal)?w.energyKcal:null}}
function sportMerge(a,b){
  const byId=new Map();
  for(const r of [...(a?.records||[]),...(b?.records||[])]){
    if(!r||typeof r.id!=='string'||!Number.isFinite(r.rev))continue;
    const old=byId.get(r.id);
    if(!old||r.rev>old.rev||(r.rev===old.rev&&r.deleted))byId.set(r.id,r);
  }
  return {v:1,at:Math.max(a?.at||0,b?.at||0),records:[...byId.values()]};
}
function sportTrack(workouts,previous,now=Date.now()){
  const old=new Map((previous?.records||[]).map(r=>[r.id,r])),seen=new Set(),records=[];
  for(const w of workouts.filter(w=>!w.demo)){
    const facts=sportFacts(w),prior=old.get(w.id);seen.add(w.id);
    const same=prior&&!prior.deleted&&JSON.stringify(sportFacts(prior))===JSON.stringify(facts);
    records.push(same?prior:{...facts,rev:Math.max(now,(prior?.rev||0)+1)});
  }
  for(const r of old.values())if(!seen.has(r.id))records.push(r.deleted?r:{id:r.id,deleted:true,rev:Math.max(now,r.rev+1)});
  return {v:1,at:records.reduce((n,r)=>Math.max(n,r.rev),0),records};
}

/* Reuse Happy's account and encrypted app_sync protocol. Local summaries work offline. */
let sportCloudBusy=false,sportSyncTimer,sportSyncError='',sportLastCloud=0;
function writeSportLink(){
  state.sportLink=sportTrack(state.workouts,state.sportLink);
  const owner=state.sportOwner||'local';let cached=null;try{cached=JSON.parse(localStorage.getItem(SPORT_LINK_KEY))}catch{}
  const summary={...sportMerge(cached?.owner===owner?cached:null,state.sportLink),owner};
  try{localStorage.setItem(SPORT_LINK_KEY,JSON.stringify(summary))}catch{sportSyncError='Не удалось сохранить связь с Day и Meal'}
  window.dispatchEvent(new Event('happy-sport-link'));
  return summary;
}
persist=function(){writeSportLink();oldPersist();clearTimeout(sportSyncTimer);sportSyncTimer=setTimeout(syncSportCloud,1200)};
async function putSportConditional(summary,expected){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:clAad('sport','link')},CL.ck,clUtf(JSON.stringify(summary))));
  const row={user_id:CL.s.uid,app:'sport',kind:'link',v:1,iv:clB64(iv),data:clB64(data),at:summary.at};
  const result=expected==null
    ?await clRest('POST','?on_conflict=user_id,app,kind',row,'resolution=ignore-duplicates,return=representation')
    :await clRest('PATCH','?app=eq.sport&kind=eq.link&at=eq.'+expected,row,'return=representation');
  return !!result?.length;
}
async function syncSportCloud(){
  if(!CL.ready||!clOn()||sportCloudBusy)return;
  if(state.sportOwner&&state.sportOwner!==CL.s.uid){sportSyncError='Эти записи связаны с другим аккаунтом Happy. Войди в него для синхронизации.';paintHappyAccount();return}
  sportCloudBusy=true;sportSyncError='';paintHappyAccount();
  const uid=CL.s.uid;
  try{
    if(!state.sportOwner){state.sportOwner=uid;writeSportLink();oldPersist()}
    for(let attempt=0;attempt<4;attempt++){
      // Read timestamp on both sides of decrypt to detect another writer before CAS.
      const before=await clAt('sport','link'),remote=await clGet('sport','link'),after=await clAt('sport','link');
      if(before!==after)continue;
      if(CL.s?.uid!==uid)throw new Error('Аккаунт изменился — повтори синхронизацию');
      if(remote&&(remote.v!==1||!Array.isArray(remote.records)))throw new Error('Неизвестный формат сводки Sport');
      const local=writeSportLink(),merged=sportMerge(remote,local);
      merged.owner=uid;merged.at=Math.max(Date.now(),(after||0)+1,merged.at);
      if(!await putSportConditional(merged,after))continue;
      // Store combined summary for Day/Meal, without importing incomplete workouts into the journal.
      localStorage.setItem(SPORT_LINK_KEY,JSON.stringify(merged));
      sportLastCloud=Date.now();CL.last=sportLastCloud;clStore();window.dispatchEvent(new Event('happy-sport-link'));
      return;
    }
    throw new Error('Записи изменились на другом устройстве. Повтори синхронизацию.');
  }catch(e){sportSyncError=e.message||'Не удалось передать сводку'}
  finally{sportCloudBusy=false;paintHappyAccount()}
}
function paintHappyAccount(){
  const box=$('#happy-account');if(!box)return;
  box.innerHTML=HappyUI.account({sport:true,connected:clOn(),email:CL.s?.email,secondary:HappyUI.lastText(sportLastCloud||CL.last),busy:CL.busy,
    error:sportSyncError||CL.err,message:sportCloudBusy?'Обновляем связь…':CL.msg,draft:HappyUI.draft(box)});
}
function sportAuthDo(action){
  if(action==='out'){sportLastCloud=0;sportSyncError=''}
  return HappyUI.act(action,{state:CL,box:()=>$('#happy-account'),signIn:clSignIn,signOut:clSignOut,paint:paintHappyAccount,afterSignIn:syncSportCloud,refresh:syncSportCloud});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-happy]');if(b)sportAuthDo(b.dataset.happy)});
window.addEventListener('storage',async e=>{if(e.key===CL_KEY){CL.s=null;CL.ck=null;CL.kraw=null;await clLoad();paintHappyAccount()}});
window.addEventListener('online',syncSportCloud);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSportCloud()});
writeSportLink();oldPersist();
clLoad().then(()=>{paintHappyAccount();syncSportCloud();
  if(sportRequestedId&&!state.workouts.some(w=>w.id===sportRequestedId)){

  }
});

}

function planText(t){const s=t.schedule;return `${t.title}\n${dateLabel(s.start.slice(0,10))} ${s.start.slice(0,4)}, ${s.start.slice(11,16)} (Москва)\nДлительность: ${s.minutes} мин${s.note?'\n\n'+s.note:''}\n\n${t.items.map(([id,phase,count])=>`${phaseNames[phase]} · ${exercise(id)?.name||id} · ${count} подх.`).join('\n')}`}
function calendarEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function calendarFold(line){let out='',bytes=0;for(const char of line){const size=new TextEncoder().encode(char).length;if(bytes+size>75){out+='\r\n ';bytes=1}out+=char;bytes+=size}return out}
function planCalendar(t,now=new Date()){
  const s=t.schedule,start=new Date(s.start+':00+03:00'),end=new Date(start.getTime()+s.minutes*60000),stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Happy Sport//Training plan//RU','CALSCALE:GREGORIAN','BEGIN:VEVENT',`UID:${t.id}-next@happy-sport`,`DTSTAMP:${stamp(now)}`,`DTSTART:${stamp(start)}`,`DTEND:${stamp(end)}`,`SUMMARY:${calendarEscape(t.title)}`,`DESCRIPTION:${calendarEscape(planText(t))}`];
  if(s.reminder>=0)rows.push('BEGIN:VALARM','ACTION:DISPLAY',`TRIGGER:-PT${s.reminder}M`,`DESCRIPTION:${calendarEscape(t.title)}`,'END:VALARM');
  rows.push('END:VEVENT','END:VCALENDAR');return rows.map(calendarFold).join('\r\n')+'\r\n';

function storeTemplateTarget(input){const t=clone(templates().find(t=>t.id===input.dataset.template));if(!t||t.recommended||!input.validity.valid)return;const phase=input.dataset.phase,eid=input.dataset.exercise,key=input.dataset.templateTarget==='minutes'?'seconds':'distance',raw=input.value;t.phaseTargets??={};t.phaseTargets[phase]??={};t.phaseTargets[phase][eid]??=clone(phase==='main'?t.targets?.[eid]||{}:{});if(raw==='')delete t.phaseTargets[phase][eid][key];else t.phaseTargets[phase][eid][key]=Number(raw)*(key==='seconds'?60:1);if(baseTemplates.some(b=>b.id===t.id)){state.templateOverrides??={};state.templateOverrides[t.id]=t}else state.templates[state.templates.findIndex(x=>x.id===t.id)]=t;persist()}

/* Rest belongs to its preceding set, so it never becomes an extra approach. */
function setRestSeconds(s){return Number.isFinite(s?.restSeconds)&&s.restSeconds>0?Math.min(3600,Math.round(s.restSeconds)):null}
function renderSetRest(s,ei,si,name){const seconds=setRestSeconds(s);if(seconds==null)return '';const t=matchingCountdown('rest',ei,si),remaining=t?countdownRemaining(t):s.restDone?0:seconds,fields=isTimed({id:state.active.exercises[ei].id})&&!hasDistance(exercise(state.active.exercises[ei].id))?1:2;return swipeSetRow('rest',ei,si,`<div class="set-rest ${t?'has-countdown':''}" data-rest-row="${ei},${si}" style="--set-fields:${fields};--rest-progress:${t?countdownProgress(t):s.restDone?100:0}"><span class="rest-progress-track" aria-hidden="true"><span class="rest-progress"></span></span><span class="rest-label">Перерыв</span><label class="set-metric"><input type="text" inputmode="text" value="${countdownTime(remaining)}" ${t&&!t.finished?'readonly':''} data-rest-duration="${ei},${si}" aria-label="Перерыв после подхода ${si+1}: ${esc(name)}, секунды"><span class="set-unit">${t?'из '+countdownTime(seconds):'м:с'}</span></label>${countdownButton('rest',ei,si,name)}<button class="done rest-done ${s.restDone||t?.finished?'selected':''}" data-action="finish-rest" data-ei="${ei}" data-si="${si}" aria-label="Завершить перерыв после подхода ${si+1}: ${esc(name)}" aria-pressed="${!!s.restDone||!!t?.finished}">${icon('check')}</button></div>`)}
function renderReadRest(s){const seconds=setRestSeconds(s);return seconds==null?'':`<div class="read-rest">${icon('timer')}<span>Перерыв</span><b>${durationText(seconds)}</b></div>`}
function addSetRest(ei){const e=state.active?.exercises[ei],si=(e?.sets.length||0)-1;if(si<0)return null;if(setRestSeconds(e.sets[si])==null){e.sets[si].restSeconds=60;persist()}return [ei,si]}
function editSetRest(ei,si,value){const s=state.active?.exercises[ei]?.sets[si],n=parseSetTime(value);if(!s||String(value).trim()===''||!Number.isInteger(n)||n<1||n>3600)return false;s.restSeconds=n;s.restDone=false;if(matchingCountdown('rest',ei,si))state.active.countdown=null;persist();return true}
function removeSetRest(ei,si){const s=state.active?.exercises[ei]?.sets[si];if(!s)return;delete s.restSeconds;delete s.restDone;if(matchingCountdown('rest',ei,si))state.active.countdown=null;persist()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||!['add-rest','remove-rest'].includes(b.dataset.action))return;e.preventDefault();e.stopImmediatePropagation();const ei=Number(b.dataset.ei);if(b.dataset.action==='add-rest'){const target=addSetRest(ei);if(!target)return;render();document.querySelector(`[data-rest-duration="${target.join(',')}"]`)?.focus()}else{removeSetRest(ei,Number(b.dataset.si));render()}},true);

document.addEventListener('change',e=>{const input=e.target;if(!input.hasAttribute('data-rest-duration'))return;const [ei,si]=input.dataset.restDuration.split(',').map(Number);if(!editSetRest(ei,si,input.value)){input.value=countdownTime(setRestSeconds(state.active?.exercises[ei]?.sets[si])||60);toast('Перерыв — от 1 до 3600 секунд')}});

function workoutIsPaused(w){const p=w?.pauses?.at(-1);return !!p&&p.end==null}
function workoutActiveSeconds(w,start=w.start,end=localNow()){
 const a=Date.parse(start),b=Date.parse(end);if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a)return 0;
 const intervals=(w.pauses||[]).map(p=>[Math.max(a,Date.parse(p.start)),Math.min(b,p.end==null?b:Date.parse(p.end))]).filter(([x,y])=>Number.isFinite(x)&&Number.isFinite(y)&&y>x).sort((x,y)=>x[0]-y[0]);
 let paused=0,last=a;for(const [x,y] of intervals){paused+=Math.max(0,y-Math.max(x,last));last=Math.max(last,y)}return Math.max(0,Math.round((b-a-paused)/1000));
}
function toggleWorkoutPause(w,at=localNow()){if(!w)return;w.pauses??=[];if(workoutIsPaused(w))w.pauses.at(-1).end=at;else w.pauses.push({start:at,end:null})}
function closeWorkoutPause(w,end){if(workoutIsPaused(w))w.pauses.at(-1).end=end}
function workoutPauseButton(w){const paused=workoutIsPaused(w);return `<button class="pause-toggle" data-action="toggle-workout-pause" aria-label="${paused?'Продолжить тренировку':'Поставить тренировку на паузу'}" aria-pressed="${paused}">${icon(paused?'play':'pause')}</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="toggle-workout-pause"]');if(!b||!state.active)return;e.preventDefault();e.stopImmediatePropagation();toggleWorkoutPause(state.active);persist();render()},true);

/* One persisted countdown follows the current set/rest; workout pauses freeze it too. */
function matchingCountdown(kind,ei,si){const t=state.active?.countdown;return t&&t.kind===kind&&t.ei===ei&&t.si===si?t:null}
function countdownElapsed(t,at=localNow()){const elapsed=Math.max(0,(t.elapsed||0)+(t.running?workoutActiveSeconds(state.active,t.startedAt,at):0));return t.stopwatch?elapsed:Math.min(t.duration,elapsed)}
function countdownRemaining(t,at=localNow()){return t.finished?0:Math.max(0,t.duration-countdownElapsed(t,at))}
function countdownProgress(t){return t.finished?100:Math.min(100,countdownElapsed(t)/t.duration*100)}
function countdownTime(seconds){return `${Math.floor(Math.round(seconds)/60)}:${String(Math.round(seconds)%60).padStart(2,'0')}`}
function countdownButton(kind,ei,si,name){const t=matchingCountdown(kind,ei,si),running=t?.running&&!workoutIsPaused(state.active),label=kind==='rest'?'перерыва':'подхода';return `<button type="button" class="set-timer ${t&&!t.finished?'timer-active':''}" data-action="toggle-set-timer" data-timer-kind="${kind}" data-ei="${ei}" data-si="${si}" aria-label="${running?'Приостановить':t&&!t.finished?'Продолжить':'Запустить'} таймер ${label} ${si+1}: ${esc(name)}" aria-pressed="${!!t&&!t.finished}">${icon(running?'pause':'timer')}</button>`}
function renderSetTimer(s,ei,si,name){const t=matchingCountdown('set',ei,si);return `<span class="set-timer-cell">${countdownButton('set',ei,si,name)}<span class="set-countdown" data-set-countdown="${ei},${si}" ${t?'':'hidden'} role="timer">${t?countdownTime(t.stopwatch?countdownElapsed(t):countdownRemaining(t)):''}</span></span>`}
function startSetCountdown(kind,ei,si,at=localNow()){const e=state.active?.exercises[ei],s=e?.sets[si];if(!s)return false;const duration=kind==='rest'?setRestSeconds(s):Math.round(Number(s.seconds||0));if(!Number.isFinite(duration)||duration<0||(kind==='rest'&&duration===0))return false;if(kind==='rest')s.restDone=false;state.active.countdown={kind,ei,si,duration,stopwatch:kind==='set'&&duration===0,startedAt:at,elapsed:0,running:true,finished:false};return true}
function onSetMarked(ei,si,done){const t=state.active?.countdown;if(t&&t.ei===ei&&t.si===si)state.active.countdown=null;const s=state.active?.exercises[ei]?.sets[si];if(s)s.restDone=false;if(done)startSetCountdown('rest',ei,si)}
function toggleSetCountdown(kind,ei,si,at=localNow()){const t=matchingCountdown(kind,ei,si);if(!t||t.finished)return startSetCountdown(kind,ei,si,at);if(t.running){t.elapsed=countdownElapsed(t,at);t.running=false}else{t.startedAt=at;t.running=true}return true}
function updateSetCountdown(){const t=state.active?.countdown;if(!t)return;const remaining=countdownRemaining(t);if(!t.stopwatch&&!remaining&&!t.finished){t.elapsed=t.duration;t.running=false;t.finished=true;if(t.kind==='rest')state.active.exercises[t.ei].sets[t.si].restDone=true;persist();markRestCompleteUI(t);toast(t.kind==='rest'?'Перерыв завершён':'Время подхода вышло');const button=document.querySelector(`[data-timer-kind="${t.kind}"][data-ei="${t.ei}"][data-si="${t.si}"]`);if(button){button.innerHTML=icon('timer');button.classList.remove('timer-active');button.setAttribute('aria-pressed','false');button.setAttribute('aria-label',`Запустить таймер ${t.kind==='rest'?'перерыва':'подхода'} ${t.si+1}`)}}
 if(t.kind==='rest'){const row=document.querySelector(`[data-rest-row="${t.ei},${t.si}"]`);if(row){row.style.setProperty('--rest-progress',String(countdownProgress(t)));const input=row.querySelector('[data-rest-duration]');if(input){input.value=countdownTime(remaining);input.readOnly=!t.finished}}}else{const label=document.querySelector(`[data-set-countdown="${t.ei},${t.si}"]`);if(label){label.hidden=false;label.textContent=countdownTime(t.stopwatch?countdownElapsed(t):remaining)}const input=document.querySelector(`[data-set-time="${t.ei},${t.si}"]`);if(input&&document.activeElement!==input){input.value=countdownTime(t.stopwatch?countdownElapsed(t):remaining);input.readOnly=!t.finished}}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action="toggle-set-timer"]');if(!b||!state.active)return;ev.preventDefault();ev.stopImmediatePropagation();if(workoutIsPaused(state.active)){toast('Сначала продолжи тренировку');return}const kind=b.dataset.timerKind,ei=Number(b.dataset.ei),si=Number(b.dataset.si);if(!toggleSetCountdown(kind,ei,si)){toast(kind==='rest'?'Укажи длительность перерыва':'Укажи длительность подхода');return}persist();render()},true);

function canCompleteSet(e,s,ei,si){const t=matchingCountdown('set',ei,si);return s.seconds>0||(!isTimed(e)&&s.reps>0)||!!(t&&countdownElapsed(t)>0)}
function finishWorkTimer(ei,si,at=localNow()){const t=matchingCountdown('set',ei,si),s=state.active?.exercises[ei]?.sets[si];if(!t||!s)return;s.seconds=countdownElapsed(t,at);state.active.countdown=null}
function finishSetRest(ei,si,at=localNow()){const s=state.active?.exercises[ei]?.sets[si];if(!s||setRestSeconds(s)==null)return false;let t=matchingCountdown('rest',ei,si);if(!t){startSetCountdown('rest',ei,si,at);t=state.active.countdown}t.elapsed=countdownElapsed(t,at);t.running=false;t.finished=true;s.restDone=true;return true}
function markRestCompleteUI(t){if(t.kind!=='rest')return;const b=document.querySelector(`[data-action="finish-rest"][data-ei="${t.ei}"][data-si="${t.si}"]`);if(b){b.classList.add('selected');b.setAttribute('aria-pressed','true')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="finish-rest"]');if(!b||!state.active)return;e.preventDefault();e.stopImmediatePropagation();if(finishSetRest(Number(b.dataset.ei),Number(b.dataset.si))){persist();render()}},true);

/* Display/edit duration as m:ss; the persisted value remains seconds. */
function parseSetTime(value){const s=String(value).trim();if(!s)return 0;if(/^\d{1,4}:[0-5]\d$/.test(s)){const [m,sec]=s.split(':').map(Number);return m*60+sec}if(/^\d{1,5}$/.test(s))return Number(s);return null}
function setTimeInput(e,ei,si,s){const t=matchingCountdown('set',ei,si),value=t?(t.stopwatch?countdownElapsed(t):countdownRemaining(t)):(s.seconds||0);return `<label class="set-metric set-time-metric"><input type="text" inputmode="text" data-set-time="${ei},${si}" value="${countdownTime(value)}" ${t&&!t.finished?'readonly':''} aria-label="Время подхода ${si+1} ${esc(e.name)}, минуты:секунды" title="Минуты:секунды, например 1:30"><span class="set-unit">м:с</span></label>`}
document.addEventListener('change',e=>{const input=e.target;if(input.dataset.setTime==null)return;const [ei,si]=input.dataset.setTime.split(',').map(Number),s=state.active?.exercises[ei]?.sets[si];if(!s)return;const seconds=parseSetTime(input.value);if(seconds==null||seconds>86400){input.value=countdownTime(s.seconds||0);toast('Время: минуты:секунды, например 1:30');return}s.seconds=seconds;if(matchingCountdown('set',ei,si))state.active.countdown=null;input.value=countdownTime(seconds);persist()});

function swipeSetRow(kind,ei,si,html){return `<div class="set-swipe" data-swipe-kind="${kind}" data-ei="${ei}" data-si="${si}" tabindex="0" role="group" aria-label="${kind==='rest'?'Перерыв после подхода':'Подход'} ${si+1}. Свайп влево для удаления" aria-keyshortcuts="Delete"><button type="button" class="swipe-delete" data-action="delete-set-row" data-row-kind="${kind}" data-ei="${ei}" data-si="${si}" aria-label="Удалить ${kind==='rest'?'перерыв после подхода':'подход'} ${si+1}">${icon('trash')}<span>Удалить</span></button><div class="swipe-content">${html}</div></div>`}
function deleteWorkoutRow(kind,ei,si){const w=state.active,e=w?.exercises[ei];if(!e?.sets[si])return null;const previous=clone(e.sets),countdown=clone(w.countdown||null);if(kind==='rest')removeSetRest(ei,si);else{e.sets.splice(si,1);const t=w.countdown;if(t?.ei===ei){if(t.si===si)w.countdown=null;else if(t.si>si)t.si--}}persist();return ()=>{if(state.active!==w)return;e.sets=previous;w.countdown=countdown;persist();render()}}
function setSwipeOpen(row,open){row.classList.toggle('swipe-open',open);row.querySelector('.swipe-content').style.transform=open?'translateX(-66px)':''}
let setSwipeGesture=null;
document.addEventListener('pointerdown',e=>{const row=e.target.closest('.set-swipe');if(!row||e.target.closest('input,button,textarea,select')||e.button>0)return;setSwipeGesture={row,id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,horizontal:false};});
document.addEventListener('pointermove',e=>{const g=setSwipeGesture;if(!g||g.id!==e.pointerId)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(!g.horizontal){if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){setSwipeGesture=null;return}if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)*1.4)return;g.horizontal=true;g.row.setPointerCapture?.(e.pointerId)}g.dx=dx;if(e.cancelable)e.preventDefault();g.row.classList.add('swipe-dragging');g.row.querySelector('.swipe-content').style.transform=`translateX(${Math.max(-80,Math.min(0,dx+(g.row.classList.contains('swipe-open')?-66:0)))}px)`;}, {passive:false});
function endSetSwipe(e,cancel=false){const g=setSwipeGesture;if(!g||g.id!==e.pointerId)return;setSwipeGesture=null;g.row.classList.remove('swipe-dragging');if(cancel){setSwipeOpen(g.row,false);return}if(!g.horizontal)return;for(const r of document.querySelectorAll('.set-swipe.swipe-open'))if(r!==g.row)setSwipeOpen(r,false);setSwipeOpen(g.row,g.dx< -35||(g.row.classList.contains('swipe-open')&&g.dx<25));}
document.addEventListener('pointerup',e=>endSetSwipe(e));
document.addEventListener('pointercancel',e=>endSetSwipe(e,true));
document.addEventListener('keydown',e=>{const row=e.target.closest('.set-swipe');if(!row||e.target!==row)return;if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();setSwipeOpen(row,true);row.querySelector('.swipe-delete').focus()}if(e.key==='Escape')setSwipeOpen(row,false)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="delete-set-row"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const undo=deleteWorkoutRow(b.dataset.rowKind,Number(b.dataset.ei),Number(b.dataset.si));if(undo){render();toast(b.dataset.rowKind==='rest'?'Перерыв удалён':'Подход удалён',undo)}},true);

let exerciseHistoryId=null,exerciseHistoryMode='date';
function exerciseHistoryKind(id){const e=exercise(id),profile=e?.profile||'';return /assisted/.test(profile)?'assisted':isLoaded({id})?'weight':hasDistance(e)&&state.workouts.some(w=>!w.demo&&w.exercises.some(x=>x.id===id&&x.sets.some(s=>s.done&&Number.isFinite(s.distance)&&s.distance>0)))?'distance':isTimed({id})?'time':'reps'}
function exerciseHistoryEntries(id){const kind=exerciseHistoryKind(id);return state.workouts.filter(w=>!w.demo).flatMap(w=>{
 const sets=w.exercises.filter(e=>e.id===id).flatMap(e=>e.sets).filter(s=>s.done);if(!sets.length)return [];
 const positive=(k)=>sets.filter(s=>Number.isFinite(s[k])&&s[k]>0),sum=k=>positive(k).reduce((n,s)=>n+s[k],0),max=k=>positive(k).length?Math.max(...positive(k).map(s=>s[k])):null;
 const duration=positive('seconds').length?sum('seconds'):null,distance=positive('distance').length?sum('distance'):null;

function facts(){const food=nutrition();let workouts=[];if(!meal)workouts=state.workouts.filter(w=>!w.demo&&w.start?.slice(0,10)===date());else try{const o=JSON.parse(localStorage.getItem('hd_link_sport_v1'));if(o?.owner===owner())workouts=(o.records||[]).filter(w=>!w.deleted&&w.start?.slice(0,10)===date())}catch{}return {food,eaten:food?food.k:null,spent:null,rest:null,training:workouts.length&&workouts.every(w=>Number.isFinite(w.energyKcal))?workouts.reduce((n,w)=>n+w.energyKcal,0):null,minutes:workouts.reduce((n,w)=>n+Math.max(0,w.duration||0)/60,0),steps:null}}
function number(v){return v==null?'—':Math.round(v).toLocaleString('ru-RU')}
const hues={pink:350,violet:305,blue:262,teal:180};
function metricRow(color,name,value,unit,goal,progress){const h=hues[color],tone=(l)=>lchHex(l,.12,h*Math.PI/180);const valid=Number.isFinite(value),g=Number(goal)>0?Number(goal):null;const ratio=valid&&g?Math.max(0,value/g):null;const label=valid?number(value)+(g?'/'+number(g):'')+(unit?' '+unit:''):'—';return `<div class="he-metric"><i class="he-dot" style="background:${tone(.8)}"></i><span>${name}</span><b>${label}</b><span class="he-bar"><i style="width:${ratio==null?0:Math.min(1,ratio)*100}%;background:linear-gradient(90deg,${tone(.86)},${tone(.72-.16*clamp(((ratio||0)-.85)/.35,0,1))})"></i></span></div>`}
function widget(){const f=facts(),g=f.food?.g||{};S.bal=mode==='balance';S.knob=mode==='balance'?(meal?'eat':'spent'):mode;const missing=mode==='balance'?(f.eaten==null||f.spent==null):f[mode==='eat'?'eaten':'spent']==null;let svg=ringSvg(config,f.eaten||0,f.spent||0,1.5,'Кольцо энергии');if(missing)svg=svg.replace(/<b>[^<]*<\/b>/,'<b>—</b>');let rows='';if(mode==='eat')rows=metricRow('pink','Белки',f.food?.p,'г',g.p)+metricRow('violet','Жиры',f.food?.f,'г',g.f)+metricRow('blue','Углеводы',f.food?.c,'г',g.c)+metricRow('teal','Клетчатка',f.food?.fib,'г',g.fib);else if(mode==='spent')rows=metricRow('violet','Покой',f.rest,'ккал')+metricRow('pink','Тренировки',f.training,'ккал')+metricRow('blue','Шаги',f.steps,'')+metricRow('teal','Время',f.minutes,'мин');else{const d=f.eaten!=null&&f.spent!=null?f.eaten-f.spent:null;rows=metricRow('teal',d!=null&&d>0?'Сжечь':'Запас',d==null?null:Math.abs(d),'ккал')+metricRow('blue','Шаги до цели',null,'')+metricRow('violet','Ходьба',null,'мин')+metricRow('pink','Белка до цели',Number(g.p)>0&&f.food?.p!=null?Math.max(0,Number(g.p)-f.food.p):null,'г')}
return '<div class="he-layout"><div class="he-plate">'+svg+'<button type="button" class="he-center" data-energy-cycle aria-label="Сменить режим энергии. Сейчас: '+(mode==='eat'?'съедено':mode==='spent'?'потрачено':'баланс')+'"></button></div><div class="he-info">'+rows+'</div></div>'}
function paint(){const el=document.getElementById(meal?'mlKb':'happy-energy');if(el){el.classList.add('happy-energy');el.innerHTML=widget()}}
function publishMeal(){if(!meal)return;try{const sum=linkSummary();localStorage.setItem(sharedKey(),JSON.stringify(sum))}catch{}}
async function refresh(){if(meal){publishMeal();paint();return}if(typeof clOn==='function'&&clOn()&&CL.ck){try{const uid=owner(),o=await clGet('meal','link');acceptMeal(o,uid)}catch{}}paint()}
if(meal){const originalSummary=linkSummary;linkSummary=function(){return enrichedMealSummary(originalSummary)}}
if(meal){const original=renderDay;renderDay=function(){const r=original.apply(this,arguments);publishMeal();paint();return r};}else{const original=renderDiary;renderDiary=function(){const root=document.createElement('div');root.innerHTML=original();const old=root.querySelector('.energy');if(old)old.outerHTML='<section class="card happy-energy" id="happy-energy">'+widget()+'</section>';return root.innerHTML};render()}
document.addEventListener('click',e=>{if(e.target.closest('[data-energy-cycle]')){const modes=meal?['eat','balance','spent']:['spent','balance','eat'];mode=modes[(modes.indexOf(mode)+1)%3];paint()}});
window.addEventListener('storage',()=>{remoteMeal=null;paint()});window.addEventListener('pageshow',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(()=>{if(!document.hidden)refresh()},30000);refresh();
})();

/* Full journal transfer. Account/session/keys are never included in backups. */
const SPORT_BACKUP_PREV=KEY+'-before-import';
const sportDataFields=['version','workouts','measurements','customExercises','templates','active','energy','demoPulse','exerciseOverrides','favoriteExercises','measurementTrash','templateOverrides'];
let sportTransferBusy=false,sportPendingRestore=null;
function sportBackup(){const data={};for(const k of sportDataFields)if(state[k]!==undefined)data[k]=clone(state[k]);return {app:'Happy Sport',version:1,exportedAt:new Date().toISOString(),data}}
function sportValidateBackup(input){
  if(!input||!['Happy Sport','happy-sport'].includes(input.app)||input.version!==1)throw new Error('Нужна копия Happy Sport версии 1. JSON из Meal или Day загружай в соответствующее приложение.');
  const source=input.data||input;
  // Reject prototype keys at every depth before retaining arbitrary journal fields.
  JSON.stringify(source,(k,v)=>{if(['__proto__','constructor','prototype'].includes(k))throw new Error('Недопустимое поле в копии');return v});
  const object=x=>x&&typeof x==='object'&&!Array.isArray(x),text=x=>typeof x==='string',list=x=>Array.isArray(x)&&x.length<=50000;
  const ex=x=>object(x)&&text(x.id)&&text(x.name)&&list(x.sets)&&x.sets.every(s=>object(s)&&Object.values(s).every(v=>v==null||['string','number','boolean'].includes(typeof v)));
  const workout=x=>object(x)&&text(x.id)&&text(x.title)&&text(x.start)&&/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(x.start)&&text(x.end)&&Number.isFinite(x.duration)&&x.duration>=0&&list(x.exercises)&&x.exercises.every(ex);
  if(source.version!==1||!list(source.workouts)||!source.workouts.every(workout)||!list(source.measurements)||!source.measurements.every(m=>object(m)&&text(m.date)&&/^\d{4}-\d\d-\d\d$/.test(m.date)&&object(m.values)&&Object.values(m.values).every(v=>v===null||Number.isFinite(v))))throw new Error('Повреждены тренировки или замеры. Данные не изменены.');
  if(new Set(source.workouts.map(w=>w.id)).size!==source.workouts.length)throw new Error('В копии повторяются ID тренировок');
  if(!list(source.customExercises)||!source.customExercises.every(e=>object(e)&&text(e.id)&&text(e.name)&&list(e.aliases)&&list(e.equipment)&&text(e.profile))||!list(source.templates)||!source.templates.every(t=>object(t)&&text(t.id)&&text(t.title)&&list(t.items)&&t.items.every(i=>Array.isArray(i)&&i.length>=3&&text(i[0])&&text(i[1])&&Number.isFinite(i[2]))))throw new Error('Повреждены упражнения или шаблоны');
  if(!object(source.energy)||!['burn','intake','steps','training','minutes'].every(k=>Number.isFinite(source.energy[k])))throw new Error('Повреждены показатели энергии');
  if(source.active!=null&&!(object(source.active)&&text(source.active.id)&&text(source.active.title)&&text(source.active.start)&&list(source.active.exercises)&&source.active.exercises.every(ex)))throw new Error('Повреждена текущая тренировка');
  for(const k of ['exerciseOverrides','templateOverrides'])if(source[k]!==undefined&&!object(source[k]))throw new Error('Повреждены настройки библиотеки');
  if(source.favoriteExercises!==undefined&&(!list(source.favoriteExercises)||!source.favoriteExercises.every(text)))throw new Error('Повреждено избранное');
  const result={};for(const k of sportDataFields)if(source[k]!==undefined)result[k]=clone(source[k]);return result;
}
function sportBackupInfo(data){return `${data.workouts.length} тренировок · ${data.measurements.length} замеров · ${data.templates.length} шаблонов`}
function sportPreviewRestore(input){
  const data=sportValidateBackup(input);sportPendingRestore=data;
  openSheet('Восстановить журнал',`<p class="sheet-info">${esc(sportBackupInfo(data))}</p><p class="sheet-info">Копия заменит текущий журнал, включая подходы, заметки и текущую тренировку. Сейчас: ${esc(sportBackupInfo(state))}. Прежний журнал сохранится для отмены.</p><button class="button primary" data-transfer="confirm">Восстановить эту копию</button><button class="button" data-action="close-sheet" style="margin-top:12px">Отмена</button>`);
}
function sportApplyRestore(data){
  if(sportCloudBusy)throw new Error('Дождись завершения связи с облаком и повтори');
  const next=clone(data);if(state.sportOwner)next.sportOwner=state.sportOwner;
  // Save rollback first. A quota/storage failure leaves the current journal intact.
  localStorage.setItem(SPORT_BACKUP_PREV,JSON.stringify(sportBackup()));
  localStorage.setItem(KEY,JSON.stringify(next));
  state=next;clearTimeout(sportSyncTimer);persist();sportPendingRestore=null;goto('profile');toast('Журнал восстановлен. Прежнюю версию можно вернуть в настройках.');
}
async function downloadData(){
  const blob=new Blob([JSON.stringify(sportBackup(),null,2)],{type:'application/json'}),name='happy-sport-backup-'+dayNow()+'.json';
  const file=typeof File==='function'?new File([blob],name,{type:'application/json'}):null;
  try{if(file&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Копия Happy Sport'});toast('Копия передана');return}
  const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);toast('JSON подготовлен для сохранения');
  }catch(e){toast(e.name==='AbortError'?'Сохранение отменено':e.message)}
}
const sportTransferProfile=renderProfile;
renderProfile=function(){return sportTransferProfile().replace('__HAPPY_SPORT_BACKUP__',`<div class="happy-card"><div class="happy-actions"><button class="happy-button" data-action="export">Выгрузить дневник</button><button class="happy-button" data-transfer="import">Загрузить из файла</button></div><input type="file" id="sport-backup-file" accept=".json,application/json" hidden><p class="happy-note">Весь дневник Sport одним файлом: тренировки, подходы, веса, заметки, замеры и библиотека. Загрузка заменяет дневник копией; нынешний сохраняется, и его можно вернуть.</p><div class="happy-actions" style="margin-top:12px"><button class="happy-button" data-transfer="undo" ${localStorage.getItem(SPORT_BACKUP_PREV)?'':'disabled'}>Вернуть дневник до загрузки</button></div><div class="happy-backup-cloud"><b>Облачная копия</b><p class="happy-note" style="margin:8px 0 12px">Полный резерв сохраняется и восстанавливается вручную. Для чтения нужен тот же пароль аккаунта.</p><div class="happy-actions"><button class="happy-button" data-transfer="upload" ${sportTransferBusy?'disabled':''}>Сохранить в облако</button><button class="happy-button" data-transfer="download" ${sportTransferBusy?'disabled':''}>Восстановить из облака</button></div><p class="happy-note" id="sport-transfer-status" role="status"></p></div></div>`)+`<footer class="app-version happy-version" data-app-version="36.2"><div>Happy Sport · v36.2</div><small>Обновлено 27.10.2026</small></footer>`};
function sportTransferStatus(t){const el=$('#sport-transfer-status');if(el)el.textContent=t;else toast(t)}
async function sportCloudBackup(action){
  if(sportTransferBusy)return;
  if(!clOn()){sportTransferStatus('Сначала войди в аккаунт Happy выше');return}
  if(state.sportOwner&&state.sportOwner!==CL.s.uid){sportTransferStatus('Журнал связан с другим аккаунтом. Войди в него.');return}
  const uid=CL.s.uid;sportTransferBusy=true;sportTransferStatus('Читаем облачную копию…');
  try{
    const before=await clAt('sport','journal'),remote=await clGet('sport','journal'),after=await clAt('sport','journal');
    if(before!==after||CL.s?.uid!==uid)throw new Error('Облако или аккаунт изменились. Повтори действие.');
    if(action==='download'){if(!remote)throw new Error('Полной копии ещё нет. На устройстве с журналом нажми «Сохранить журнал в облако».');sportPreviewRestore(remote);sportTransferStatus('Копия прочитана');return}
    const backup=sportBackup();sportValidateBackup(backup);
    if(remote&&!confirm('Заменить облачную копию от '+String(remote.exportedAt||'неизвестной даты')+' текущим журналом: '+sportBackupInfo(state)+'?'))return;
    const iv=crypto.getRandomValues(new Uint8Array(12)),at=Math.max(Date.now(),(after||0)+1);
    const data=clB64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:clAad('sport','journal')},CL.ck,clUtf(JSON.stringify(backup)))));
    if(data.length>4000000)throw new Error('Журнал больше лимита облачной копии. Сохрани его в JSON.');
    if(CL.s?.uid!==uid)throw new Error('Аккаунт изменился');
    const row={user_id:uid,app:'sport',kind:'journal',v:1,iv:clB64(iv),data,at};
    const saved=after==null?await clRest('POST','?on_conflict=user_id,app,kind',row,'resolution=ignore-duplicates,return=representation'):await clRest('PATCH','?app=eq.sport&kind=eq.journal&at=eq.'+after,row,'return=representation');
    if(!saved?.length)throw new Error('Копия изменена на другом устройстве. Повтори сохранение.');
    const verified=await clGet('sport','journal');if(JSON.stringify(verified)!==JSON.stringify(backup))throw new Error('Копия записана, но проверка не совпала. Повтори чтение.');
    sportTransferStatus('Полный журнал сохранён и проверен · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){sportTransferStatus(e.message||'Не удалось передать копию')}finally{sportTransferBusy=false}
}
document.addEventListener('click',async e=>{
  const action=e.target.closest('[data-transfer]')?.dataset.transfer;if(!action)return;
  try{
    if(action==='import'){const f=$('#sport-backup-file');f.value='';f.click()}
    if(action==='confirm'&&sportPendingRestore)sportApplyRestore(sportPendingRestore);
    if(action==='undo')sportPreviewRestore(JSON.parse(localStorage.getItem(SPORT_BACKUP_PREV)));
    if(['upload','download'].includes(action))await sportCloudBackup(action);
  }catch(err){toast(err.message)}
});
document.addEventListener('change',async e=>{if(e.target.id!=='sport-backup-file')return;const file=e.target.files?.[0];if(!file)return;try{if(file.size>20000000)throw new Error('JSON больше 20 МБ');sportPreviewRestore(JSON.parse(await file.text()))}catch(err){toast(err instanceof SyntaxError?'Файл не является корректным JSON':err.message)}});

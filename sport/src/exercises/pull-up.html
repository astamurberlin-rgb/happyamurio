<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подтягивания · Happy Sport</title><style>
:root{
  --bg1:#43c8f7; --bg2:#4a78ec; --bg3:#5d46da;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{

  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 46%,var(--bg3) 100%);
}
body::before{
  content:""; position:fixed; inset:-20%; z-index:-2;
  background:

    radial-gradient(38% 22% at 85% 19%, rgba(229,135,255,.42), transparent 72%),
    radial-gradient(35% 26% at 20% 82%, rgba(111,111,255,.34), transparent 74%),

}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:480px; margin:0 auto; min-height:100dvh; padding:calc(16px + env(safe-area-inset-top)) 16px calc(136px + env(safe-area-inset-bottom));}
.topline{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}

input[type=range]::-moz-range-thumb{width:28px; height:28px; border-radius:50%; background:linear-gradient(180deg,#fff,#ffe1fb); border:4px solid #ff88e5; box-shadow:0 0 0 7px rgba(255,123,221,.18), 0 0 18px rgba(255,113,220,.75)}
.stageLabels{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; text-align:center}

.tip p{margin:0; font-size:13px; line-height:1.42; color:var(--muted)}
.pointPop{position:absolute; left:50%; bottom:80px; transform:translateX(-50%); width:min(88%,320px); padding:10px 12px; background:#f9efff; color:#463682; border-radius:14px; box-shadow:0 14px 28px rgba(17,8,60,.45); font-size:12px; font-weight:700; z-index:7; text-align:center}
.fabWrap{position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(18px + env(safe-area-inset-bottom)); background:linear-gradient(180deg, rgba(75,77,199,0), rgba(75,77,199,.72) 22%, rgba(75,77,199,.95) 100%)}

.fabWrap{z-index:50;pointer-events:none}.fabInner{pointer-events:auto}

    <div class="variantBar" role="group" aria-label="Положение ладоней">
      <button class="variantChip" data-grip="overhand" aria-pressed="true">Ладони от себя</button>
      <button class="variantChip" data-grip="underhand" aria-pressed="false">Ладони к себе</button>
    </div>
    <div class="variantExplain" id="variantExplain"></div>
    <p class="variantHelp">Кадры пока общие для вариантов хвата.</p>
  </section>
  <section class="section">
    <h2>Техника</h2><h3 id="phaseTitle" hidden></h3>
    <p class="lead" id="phaseText"></p>
    <div class="tipList" id="tipList"></div>
  </section>
  <button class="addExercise" id="addExercise">Добавить в тренировку</button>
</div><script>
const variants = {
  overhand: {
    id:"hsp.ex.pull-up",
    name:"Подтягивания прямым хватом",
    short:"Прямой хват · ладони от себя",
    explain:"Ладони от себя. Начинай с ширины примерно на уровне плеч или немного шире. Большие пальцы охватывают перекладину; избегай болезненного положения в плечах.",
    byPhase:[
      { title:"Обхвати перекладину прямым хватом", text:"Ладони направлены от себя. Держи кисти в удобном положении, большие пальцы вокруг перекладины. Займи устойчивое исходное положение без прыжка, если перекладина высоко.",
        tips:[["Кисти","Ладони от себя, большой палец охватывает перекладину."],["Плечи","Начни с комфортного положения плеч без сильного зажима."],["Корпус","Пресс напряжён умеренно, без раскачивания."]] },
      { title:"Веди локти вниз и к корпусу", text:"Поднимайся силой мышц спины и рук, без махов ногами. Локти движутся вниз по удобной траектории, корпус остаётся стабильным.",
        tips:[["Локти","Не разводи их принудительно в стороны."],["Лопатки","Двигай ими плавно и контролируемо."],["Корпус","Не выбрасывай подбородок вперёд."]] },
      { title:"Подбородок выше перекладины", text:"Верхняя точка — подбородок выше перекладины без сильного запрокидывания головы. Опускайся подконтрольно.",
        tips:[["Амплитуда","Не добирай высоту только движением шеи."],["Плечи","Сохраняй контролируемое положение."],["Спуск","Опускайся плавно, без броска вниз."]] }
    ]
  },
  underhand: {
    id:"hsp.ex.chin-up",
    name:"Подтягивания обратным хватом",
    short:"Обратный хват · ладони к себе",
    explain:"Ладони к себе. Обычно удобнее хват на ширине плеч или немного уже. Не нужно специально брать слишком широкий обратный хват: ориентируйся на комфорт кистей, локтей и плеч.",
    byPhase:[
      { title:"Возьмись обратным хватом", text:"Поверни ладони к себе. Поставь кисти примерно на ширине плеч, обхвати перекладину большим пальцем и выбери комфортное положение предплечий.",
        tips:[["Кисти","Ладони к лицу, без сильного залома запястий."],["Ширина","Не заставляй себя брать чрезмерно широкий обратный хват."],["Корпус","Стабилизируй корпус перед подъёмом."]] },
      { title:"Тяни локти вниз ближе к бокам", text:"Подтягивай корпус с участием мышц спины и сгибателей локтя. Не делай рывок и не выворачивай запястья.",
        tips:[["Локти","Они движутся вниз и назад по удобной траектории."],["Бицепсы","В этом варианте сгибатели локтя заметно участвуют в движении."],["Спина","Держи естественные изгибы без раскачки."]] },
      { title:"Заверши движение без рывка", text:"Постарайся поднять подбородок над перекладиной, не вытягивая шею. Затем плавно опустись с контролем плеч и локтей.",
        tips:[["Подбородок","Не вытягивай голову вместо подъёма корпуса."],["Кисти","Избегай неприятного напряжения в запястьях."],["Возврат","Контролируй спуск."]] }
    ]
  }
};
let selectedGrip = new URLSearchParams(location.search).get("grip")==="underhand"?"underhand":"overhand";
let selectedWidth = ['narrow','medium','wide'].includes(new URLSearchParams(location.search).get('width'))?new URLSearchParams(location.search).get('width'):'medium';
const widthNames={narrow:'Узкий',medium:'Средний',wide:'Широкий'};
function chosenId(){const base=selectedGrip==='underhand'?'chin-up':'pull-up';return selectedWidth==='medium'?base:base+'-'+selectedWidth}
let toastTimer;
const phases = [
  { key:'start', chip:'01 / Старт', title:'Уверенно возьмись за перекладину', text:'Обхвати перекладину большим пальцем. Если турник высокий, безопаснее занять исходное положение с устойчивой опоры, чем подпрыгивать под контролем хуже.', tips:[['Хват','Большой палец обхватывает перекладину, кисть нейтральна, плечи не зажаты к ушам.'],['Спина','Шея длинная, грудная клетка спокойна, не выгибайся ради красоты старта.'],['Корпус','Лёгкое напряжение пресса и ягодиц помогает не раскачиваться с самого начала.']] },
  { key:'up', chip:'02 / Подъём', title:'Тяни локти вниз, а не подбородок вверх', text:'Движение начинается со спины и локтей: локти идут вниз и назад, корпус остаётся собранным, без сильной раскачки и рывка ногами.', tips:[['Локти','Думай о движении локтей вниз по дуге — так легче включить широчайшие.'],['Лопатки','Лопатки мягко приводятся и опускаются, без жёсткого зажима.'],['Корпус','Не выбрасывай подбородок и не заламывай поясницу, чтобы “добрать” амплитуду.']] },
  { key:'top', chip:'03 / Верх', title:'Доведи подбородок выше перекладины', text:'В верхней точке подбородок проходит выше перекладины за счёт силы тяги, а не за счёт вытягивания шеи. Затем — контролируемый спуск вниз.', tips:[['Высота','Цель — подбородок выше перекладины, плечи остаются под контролем.'],['Шея','Не тянусь шеей отдельно. Амплитуду создаёт всё движение, а не только голова.'],['Обратно вниз','Опускайся подконтрольно — эта часть тоже тренирует и помогает не терять технику.']] }
];
const anchors = [0,50,100];
const slider = document.getElementById('phaseSlider');
const progress = document.getElementById('progress');
const imgs = [document.getElementById('img1'),document.getElementById('img2'),document.getElementById('img3')];
const stageChip = document.getElementById('stageChip');
const phaseTitle = document.getElementById('phaseTitle');
const phaseText = document.getElementById('phaseText');
const tipList = document.getElementById('tipList');
const labels = [document.getElementById('label1'),document.getElementById('label2'),document.getElementById('label3')];
const ticks = [document.getElementById('tick1'),document.getElementById('tick2'),document.getElementById('tick3')];
const hotTips = { grip:'Хват: охвати перекладину большим пальцем и держи кисть без сильного перелома.', back:'Спина: держи корпус собранным и не вытягивай шею отдельно ради амплитуды.', core:'Корпус: лёгкое напряжение пресса помогает не раскачиваться.' };
const viewer = document.getElementById('viewer');
let popup = null;
let lastSnap = null;
function stageIndex(v){ if(v < 25) return 0; if(v < 75) return 1; return 2; }
function nearestAnchor(v){ let idx=0, dist=Infinity; anchors.forEach((a,i)=>{ const d=Math.abs(v-a); if(d<dist){dist=d; idx=i;} }); return {idx, value:anchors[idx], dist}; }
function applyMagnet(v){ const n = nearestAnchor(v); if(n.dist <= 6) return n.value; return v; }
function renderTips(list){ tipList.innerHTML = list.map((t,i)=>`<div class="tip"><div class="pin">${i+1}</div><div><strong>${t[0]}</strong><p>${t[1]}</p></div></div>`).join(''); }
function updateVisual(v){
  progress.style.width = `calc((100% - 34px) * ${v/100})`;
  if(v <= 50){ imgs[0].style.opacity = 1 - (v/50); imgs[1].style.opacity = v/50; imgs[2].style.opacity = 0; }
  else { imgs[0].style.opacity = 0; imgs[1].style.opacity = 1 - ((v-50)/50); imgs[2].style.opacity = (v-50)/50; }
  const idx = stageIndex(v);
  const p = phases[idx];
  const variantPhase = variants[selectedGrip].byPhase[idx];
  stageChip.textContent = p.chip;
  document.getElementById('phaseCaption').textContent=['Старт · руки вытянуты','Подъём · локти вниз','Верх · подбородок над перекладиной'][idx];
  phaseTitle.textContent = variantPhase.title;
  phaseText.textContent = variantPhase.text;
  renderTips(variantPhase.tips);
  labels.forEach((el,i)=>el.classList.toggle('active', i===idx));
  ticks.forEach((el,i)=>el.classList.toggle('active', i===idx));
}
function updateFromSlider(){
  let v = Number(slider.value);
  const m = applyMagnet(v);
  if(m !== v){ slider.value = m; v = m; }
  const n = nearestAnchor(v);
  if(n.dist===0 && lastSnap !== n.idx){
    lastSnap = n.idx;
    ticks[n.idx].animate([
      { transform:'translateX(-50%) scale(1.06)' },
      { transform:'translateX(-50%) scale(1.18)' },
      { transform:'translateX(-50%) scale(1.06)' }
    ], { duration:160, easing:'ease-out' });
  } else if(n.dist!==0) {
    lastSnap = null;
  }
  updateVisual(v);
}
function snapEnd(){ const n = nearestAnchor(Number(slider.value)); slider.value = n.value; updateVisual(n.value); }
slider.addEventListener('input', updateFromSlider);
slider.addEventListener('change', snapEnd);
slider.addEventListener('pointerup', snapEnd);
slider.addEventListener('touchend', snapEnd, {passive:true});
function cropFrameEdges(){for(const img of imgs){if(!img.naturalWidth||img.id!=='img1')continue;const w=img.clientWidth,h=img.clientHeight,r=Math.min(w/img.naturalWidth,h/img.naturalHeight),iw=img.naturalWidth*r,ih=img.naturalHeight*r;const left=(w-iw)/2,right=left+iw,bottom=ih-30*r;img.style.clipPath=`polygon(${left}px 0px,${right}px 0px,${right}px ${bottom}px,${left+25*r}px ${bottom}px,${left+25*r}px ${100*r}px,${left}px ${100*r}px)`}}
imgs.forEach(img=>img.addEventListener('load',cropFrameEdges));new ResizeObserver(cropFrameEdges).observe(viewer);cropFrameEdges();
updateVisual(0);

function updateVariant(){
  const variant=variants[selectedGrip];
  const widthHint={narrow:'Кисти ближе ширины плеч; выбери комфортное положение запястий.',medium:'Кисти примерно на ширине плеч.',wide:'Кисти шире плеч; не расширяй хват через дискомфорт.'}[selectedWidth];
  document.querySelectorAll('[data-grip]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.grip===selectedGrip)));
  document.querySelectorAll('[data-width]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.width===selectedWidth)));
  document.getElementById('gripState').textContent=variant.short;
  document.getElementById('variantExplain').innerHTML="<strong>"+widthNames[selectedWidth]+" "+(selectedGrip==='underhand'?'обратный':'прямой')+" хват</strong><br>"+widthHint+" "+variant.explain;
  updateVisual(Number(slider.value));
  window.parent.postMessage({type:"happy-sport.exercise-variant",grip:selectedGrip,exerciseId:chosenId()},location.origin);
}
document.querySelectorAll('[data-grip]').forEach(btn=>btn.addEventListener('click',()=>{
  selectedGrip=btn.dataset.grip;
  updateVariant();
}));
document.getElementById('expand').addEventListener('click',()=>{
  const hero=document.getElementById('exerciseHero');
  const expanded=hero.classList.toggle('expanded');
  document.getElementById('expand').textContent=expanded?"↙ Свернуть":"⤢ Увеличить";
});
function toast(message){
  const old=document.getElementById('addToast'); if(old) old.remove();
  const node=document.createElement('div');node.className='toast';node.id='addToast';
  node.setAttribute('role','status');node.textContent=message;document.body.appendChild(node);
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.remove(),2600);
}
document.querySelectorAll('[data-width]').forEach(btn=>btn.addEventListener('click',()=>{selectedWidth=btn.dataset.width;updateVariant()}));
document.getElementById('addExercise').addEventListener('click',()=>window.parent.postMessage({type:'happy-sport.exercise-add',exerciseId:chosenId()},location.origin));
updateVariant();
document.querySelectorAll('.hotspot').forEach(btn=>{ btn.addEventListener('click', ()=>{ if(popup) popup.remove(); popup = document.createElement('div'); popup.className = 'pointPop'; popup.textContent = hotTips[btn.dataset.key]; viewer.appendChild(popup); setTimeout(()=>{ if(popup){ popup.remove(); popup=null; } }, 2600); }); });

</script></body></html>

<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Day</title>
<!-- Прежний постоянный адрес: открывает текущий выпуск из shared/apps.json; ссылка ниже — запасная. -->
<script>
(function(){var fallback='../day-58/',tail=location.search+location.hash;
function go(d){location.replace(d+tail)}
try{fetch('../shared/apps.json',{cache:'no-cache',credentials:'omit'}).then(function(r){return r.ok?r.json():null}).then(function(a){var e=a&&a['day']&&a['day'].entry,d=e&&String(e).split('/')[0];go(d&&/^[a-z0-9][a-z0-9-]*$/.test(d)?'../'+d+'/':fallback)}).catch(function(){go(fallback)})}catch(e){go(fallback)}
})();
</script>
</head><body><p><a href="../day-58/">Открыть Happy Day</a></p><noscript>Для работы приложения нужен JavaScript.</noscript></body></html>

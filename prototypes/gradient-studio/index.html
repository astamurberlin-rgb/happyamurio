<!doctype html>
<html lang="ru" data-app-version="1.9">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161527">
<title>Студия градиентов · Happy</title>
<meta name="description" content="Заливка и оживление дуг Day, кольца энергии Meal и Sport и полосок строк — по темам.">
<link rel="stylesheet" href="./studio.css?v=1.9">
<script src="../../shared/happy-gradients.js?v=1"></script>
<script src="../../shared/happy-reference-themes.js?v=3"></script>
<script src="../../day-60/arc-motion.js?v=60.17"></script>
<script src="../../shared/happy-energy-ring.js?v=1"></script>
<script src="./presets.js?v=1.9"></script>
</head>
<body data-tab="fill">
<div class="shell">
  <header class="head"><h1>Студия градиентов</h1><span class="hr"><span class="acct" id="acct" role="img" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.1 4.5 4.5 0 0 0 7 18z"/><path class="ok" d="M9.5 13.2l1.8 1.8 3.4-3.6"/></svg></span><span class="ver">1.9</span></span></header>

  <div class="seg wsel" id="widgets" role="group" aria-label="Виджет">
    <button type="button" data-widget="day-arcs">Дуги</button>
    <button type="button" data-widget="meal">Meal</button>
    <button type="button" data-widget="sport">Sport</button>
    <button type="button" data-widget="day-energy">Day</button>
    <button type="button" data-widget="ref">Общий</button>
  </div>
  <div class="dock" id="dock">
    <div class="fold" id="fold">
      <div class="screen" id="screen"><div class="bgl"></div><div class="stage" id="stage"></div></div>
      <div class="pills" id="pills" role="group" aria-label="Данные"></div>
    </div>
    <button type="button" class="grab" id="grab" aria-label="Свернуть превью" aria-expanded="true"><i></i></button>
  </div>

  <section class="blk" aria-label="Тема"><div class="themes" id="themes"></div></section>

  <section class="blk" data-for="fill mine">
    <div class="lbl"><h2>Пресеты</h2><span class="acts"><button type="button" class="tbtn" id="reset" hidden>↺ Вернуть</button><button type="button" class="tbtn" id="quick">＋ В Мои</button></span></div>
    <div class="compare" id="compare"></div>
  </section>

  <section class="blk" data-for="fill">
    <div class="lbl"><h2>Схемы для всех тем</h2></div>
    <div class="line night" id="nightK" hidden><span>Ночью</span><div class="seg"><button type="button" data-nk="70">Тише</button><button type="button" data-nk="82">Мягко</button><button type="button" data-nk="100">Как днём</button><button type="button" data-nk="110">Ярче</button></div></div>
    <div class="compare row" id="schemes"></div>
  </section>

  <section class="blk card" data-for="fill">
    <div class="seg sub" id="groups" role="group" aria-label="Что настроить"></div>
    <div class="ed" id="editors"></div>
  </section>

  <section class="blk" data-for="anim">
    <div class="lbl"><h2>Жизнь кольца</h2><span class="acts"><button type="button" class="tbtn" id="resetA" hidden>↺ Вернуть</button><button type="button" class="tbtn" id="quickA">＋ В Мои</button></span></div>
    <div class="minis" id="life"></div>
    <div class="lbl"><h2>Эффект</h2></div>
    <div class="minis" id="effects"></div>
    <div class="lbl"><h2>Свет внутри</h2></div>
    <div class="minis" id="lights"></div>
  </section>
  <section class="blk card" data-for="anim">
    <div class="seg sub" id="agroups" role="group" aria-label="Что настроить"><button type="button" data-ag="rhythm">Ритм</button><button type="button" data-ag="light">Свет</button></div>
    <div class="ed" id="animEd"></div>
  </section>

  <section class="blk card" data-for="mine">
    <div class="save"><input id="saveName" maxlength="40" placeholder="Название варианта" aria-label="Название варианта"><button type="button" class="btn primary" id="saveBtn">Сохранить</button></div>
    <div class="mine" id="mine"></div>
    <div class="actions"><button type="button" class="btn" id="copy">Скопировать пресет</button><button type="button" class="btn ghost" id="showOut" aria-expanded="false">Текст</button></div>
    <textarea class="out" id="out" readonly aria-label="Пресет текстом" hidden></textarea>
  </section>

  <p class="foot">Студия градиентов 1.9 · <span id="base">Day 61.2 · Meal 34.4 · Sport 45.2</span></p>
</div>

<nav class="tabbar" id="tabbar" aria-label="Разделы студии">
  <button type="button" data-tab="fill"><svg viewBox="0 0 24 24"><path d="M12 3.5c3.6 4.3 6 7.6 6 10.6a6 6 0 0 1-12 0c0-3 2.4-6.3 6-10.6z"/></svg>Заливка</button>
  <button type="button" data-tab="anim"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="2.6"/></svg>Оживление</button>
  <button type="button" data-tab="mine"><svg viewBox="0 0 24 24"><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1z"/></svg>Мои</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./studio.js?v=1.9"></script>
</body>
</html>
